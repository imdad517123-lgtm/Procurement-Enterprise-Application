<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Employee Registration</title>

<link rel="stylesheet" href="login.css">

</head>

<body>

<div class="login-container">

<div class="login-box">

<h2>Employee Registration</h2>

<div class="form-group">

<label>Employee Company ID</label>
<input type="text" id="employeeCompanyId">

</div>

<div class="form-group">

<label>Employee Name</label>
<input type="text" id="employeeName">

</div>

<div class="form-group">

<label>Email</label>
<input type="email" id="email">

</div>

<div class="form-group">

<label>Password</label>
<input type="password" id="password">

</div>

<div class="form-group">

<label>Department</label>
<input type="text" id="department">

</div>

<div class="form-group">

<label>Role</label>

<select id="role" onchange="checkRegistrationRole()">

<option value="">Select Role</option>

<option value="EMPLOYEE">EMPLOYEE</option>

<option value="MANAGER">MANAGER</option>

<option value="PROCUREMENT_OFFICER">PROCUREMENT_OFFICER</option>

<option value="FINANCE">FINANCE</option>

<option value="SUPPLIER">SUPPLIER</option>

</select>

</div>

<button onclick="registerEmployee()">Register</button>

<p id="message"></p>

<p style="margin-top:15px;text-align:center;">

Already have an account?

<a href="login.html">Login Here</a>

</p>

</div>

</div>

<script src="register.js"></script>

</body>

</html>
