<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employee Dashboard</title>

<link rel="stylesheet" href="employee-dashboard.css">
</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>Procurement</h2>

        <ul>

            <li>
                <a href="employee-dashboard.html" class="active">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="employee-purchase-requisition.html">
                    Create Purchase Request
                </a>
            </li>

            <li>
                <a href="my-requests.html">
                    My Requests
                </a>
            </li>

      

            <li>
                <a href="login.html" onclick="logout()">
                    Logout
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main -->

    <main class="main-content">

        <header class="topbar">

            <h1>Employee Dashboard</h1>

            <p id="welcomeText">
                Welcome Employee
            </p>

        </header>

        <!-- Cards -->

        <section class="dashboard-cards">

            <div class="card">

                <h3>Total Requests</h3>

                <h2 id="myRequests">0</h2>

            </div>

            <div class="card">

                <h3>Pending</h3>

                <h2 id="pendingRequests">0</h2>

            </div>

            <div class="card">

                <h3>Approved</h3>

                <h2 id="approvedRequests">0</h2>

            </div>

            <div class="card">

                <h3>Rejected</h3>

                <h2 id="rejectedRequests">0</h2>

            </div>

        </section>

        <!-- Buttons -->

        <section class="quick-actions">

            <button onclick="location.href='employee-purchase-requisition.html'">

                Create Purchase Request

            </button>

            <button onclick="location.href='my-requests.html'">

                View My Requests

            </button>

          

        </section>

        <!-- Table -->

        <section class="table-section">

            <h2>Recent Purchase Requests</h2>

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Item</th>

                    <th>Qty</th>

                    <th>Cost</th>

                    <th>Status</th>

                    <th>Date</th>

                </tr>

                </thead>

                <tbody id="requestTable">

                </tbody>

            </table>

        </section>

    </main>

</div>

<script src="employee-dashboard.js"></script>

</body>
</html>
