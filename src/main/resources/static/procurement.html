<!DOCTYPE html>
<html>

<head>

<title>Procurement Officer Dashboard</title>

<link rel="stylesheet" href="procurement.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>


<body>

	<nav class="navbar navbar-dark bg-dark px-4">

	    <div class="container-fluid">

	        <div>
	            <h3 class="text-white mb-0">
	                Procurement Officer Dashboard
	            </h3>

	            <small class="text-light">
	                Procurement Management System
	            </small>
	        </div>



	        <div class="d-flex align-items-center">


	            <!-- Delivery Tracking Button -->
	            <a href="procurement-delivery.html" 
	               class="btn btn-warning me-3">

	                Delivery Tracking

	            </a>



	            <span class="text-white me-4 fs-5">
	                 Procurement Officer
	            </span>



	            <button class="btn btn-danger" 
	                    onclick="logout()">

	                Logout

	            </button>


	        </div>


	    </div>

	</nav>


<div class="container mt-4">


<h3>
Manager Approved Purchase Requests
</h3>



<table class="table table-bordered table-hover">


<thead class="table-dark">

<tr>

<th>Request ID</th>
<th>Employee</th>
<th>Item</th>
<th>Quantity</th>
<th>Estimated Cost</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>


<tbody id="requestTable">

</tbody>


</table>



<hr>


<!-- ==============================
 VERIFIED SUPPLIERS
=============================== -->


<h3 class="mt-4">

Verified Suppliers

</h3>



<table class="table table-bordered">


<thead class="table-dark">

<tr>

<th>Supplier ID</th>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>City</th>
<th>GST</th>
<th>Status</th>

</tr>


</thead>



<tbody id="supplierTable">


</tbody>



</table>


</div>



<!-- ==============================
 CREATE PO MODAL
=============================== -->

<div class="modal fade" id="supplierModal">

    <div class="modal-dialog">

        <div class="modal-content">


            <div class="modal-header">

                <h5 class="modal-title">
                    Create Purchase Order
                </h5>

                <button class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>



            <div class="modal-body">


                <!-- Request ID -->
                <input type="hidden" id="requestId">



                <!-- Supplier -->
                <div class="mb-3">

                    <label class="form-label">
                        Select Supplier
                    </label>

                    <select id="supplierId"
                            class="form-control"
                            onchange="showSupplierEmail()">

                        <option value="">
                            Select Supplier
                        </option>

                    </select>

                </div>




                <!-- Supplier Name -->

                <div class="mb-3">

                    <label class="form-label">
                        Supplier Name
                    </label>

                    <input type="text"
                           id="supplierName"
                           class="form-control"
                           readonly>

                </div>





                <!-- Supplier Email -->

                <div class="mb-3">

                    <label class="form-label">
                        Supplier Email
                    </label>


                    <input type="email"
                           id="supplierEmail"
                           class="form-control"
                           readonly>

                </div>





                <!-- Status -->

                <div class="mb-3">

                    <label class="form-label">
                        Status
                    </label>


                    <input type="text"
                           id="status"
                           class="form-control"
                           value="CREATED"
                           readonly>

                </div>





                <!-- PO Date -->

                <div class="mb-3">

                    <label class="form-label">
                        PO Date
                    </label>


                    <input type="date"
                           id="poDate"
                           class="form-control">

                </div>



                <p id="message"></p>


            </div>





            <div class="modal-footer">


                <button class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Cancel

                </button>



                <button class="btn btn-primary"
                        onclick="createPO()">

                    Generate PO

                </button>



            </div>



        </div>

    </div>

</div>




<script src="procurement.js"></script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">

</script>
