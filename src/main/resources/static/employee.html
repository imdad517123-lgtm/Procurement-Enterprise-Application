<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management</title>

    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>Procurement</h2>

        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="employee.html" class="active">Employees</a></li>
            <li><a href="purchase-requisition.html">Purchase Requisition</a></li>
            <li><a href="workflow.html">Workflow</a></li>
            <li><a href="approval-history.html">Approval History</a></li>
        </ul>

    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Header -->
        <header class="topbar">
            <h1>Employee Management</h1>
            <p>Add, Update and Delete Employees</p>
        </header>

        <!-- Employee Form -->
        <div class="card">

            <h2>Add Employee</h2>

            <input type="hidden" id="employeeId">

            <div class="form-group">
                <label>Employee Company ID</label>
                <input type="text" id="employeeCompanyId">
            </div>

            <div class="form-group">
                <label>Employee Name</label>
                <input type="text" id="employeeName">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email">
            </div>
			<div class="form-group">
			    <label>Password</label>
			    <input type="password"
			           id="password"
			           placeholder="Enter Password">
			</div>
            <div class="form-group">
                <label>Department</label>
                <input type="text" id="department">
            </div>

            <div class="form-group">
                <label>Role</label>

                <select id="role">
                    <option value="">Select Role</option>
                    <option value="EMPLOYEE">EMPLOYEE</option>
                    <option value="MANAGER">MANAGER</option>
                    <option value="PROCUREMENT_OFFICER">PROCUREMENT OFFICER</option>
                    <option value="FINANCE">FINANCE</option>
                </select>

            </div>

            <button onclick="saveEmployee()">Save</button>
            <button onclick="clearForm()">Clear</button>

            <p id="message"></p>

        </div>

        <br>

        <!-- Employee Table -->
        <div class="table-section">

            <h2>Employee List</h2>

            <table>

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Company ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Role</th>
                   
                </tr>
                </thead>

                <tbody id="employeeTable">

                </tbody>

            </table>

        </div>

    </main>

</div>

<script src="employee.js"></script>

</body>
</html>
