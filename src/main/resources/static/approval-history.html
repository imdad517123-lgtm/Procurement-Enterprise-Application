<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Approval History</title>

    <link rel="stylesheet" href="approval-history.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <!-- ================= SIDEBAR ================= -->

        <div class="sidebar">

            <div class="logo">
                <h2>Procurement</h2>
            </div>

            <ul class="menu">

                <li>
                    <a href="manager-dashboard.html">
                        <i class="fa-solid fa-house"></i>
                        Dashboard
                    </a>
                </li>

                <li class="active">
                    <a href="approval-history.html">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                        Approval History
                    </a>
                </li>

            </ul>

            <button class="logout-btn" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </button>

        </div>

        <!-- ================= MAIN CONTENT ================= -->

        <div class="main-content">

            <!-- HEADER -->

            <header class="header">

                <div>
                    <h1>Approval History</h1>
                    <p>View All Purchase Requisition Approval History</p>
                </div>

                <div class="profile">
                    <i class="fa-solid fa-user-tie"></i>

                    <div>
                        <h3>Manager</h3>
                        <span>Approval Authority</span>
                    </div>
                </div>

            </header>

            <!-- TABLE -->

            <section class="table-card">

                <div class="table-header">

                    <h2>
                        <i class="fa-solid fa-list-check"></i>
                        Approval History
                    </h2>

                    <br>

                    <button class="refresh-btn" onclick="loadHistory()">
                        <i class="fa-solid fa-rotate"></i>
                        Refresh
                    </button>

                </div>

                <div class="table-container">

                    <table>

                        <thead>

                            <tr>
                                <th>History ID</th>
                                <th>Request ID</th>
                                <th>Employee</th>
                                <th>Approved By</th>
                                <th>Role</th>
                                <th>Action</th>
                                <th>Comments</th>
                                <th>Action Date</th>
                            </tr>

                        </thead>

                        <tbody id="historyTable">

                            <!-- Loaded by JavaScript -->

                        </tbody>

                    </table>

                </div>

            </section>

        </div>

    </div>

    <script src="approval-history.js"></script>

    <script>
        function logout() {
            localStorage.clear();
            window.location.href = "login.html";
        }
    </script>

</body>

</html>
